[global]
# Optional: set one profile name, or leave empty and use command-line options.
profile =

[project]
input_dir = input
work_dir = work
output_dir = output

[files]
# Put your own media under input/. The repository does not include media files.
main_video = input/main.mp4
ref_video = input/ref.mp4
shutter_sfx = input/shutter/shutter.m4a
moan1_audio = input/voice1/voice1.mp3
moan2_audio = input/voice2/voice2.mp3
sfx_audio = input/sfx/sfx.mp3
mechanical_audio = input/mechanical/mechanical.mp3
final_video = output/final.mp4

[select]
# voice_source: ref | moan | none
# water_source: ref | mechanical | none
# moan_variant: 1 | 2
ambience_source = ref
voice_source = ref
moan_variant = 1
water_source = ref
enable_sfx = false
enable_shutter = true
enable_motion_mechanical = true

[insert]
# Times support seconds, MM:SS, or HH:MM:SS. Ranges use start-end.
voice_times =
voice_ranges =
water_times =
water_ranges =
sfx_times =
sfx_ranges =
shutter_times =
shutter_ranges =

[mechanical]
# Time ranges inside mechanical_audio used to cut reusable effect segments.
water_source_ranges =

[schedule]
# Profiles listed here are rendered in order with --use-schedule.
profiles =
